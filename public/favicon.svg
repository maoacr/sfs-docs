<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- Balón de fútbol clásico — pentágonos y hexágonos -->
  <defs>
    <radialGradient id="shine" cx="35%" cy="30%">
      <stop offset="0%" stop-color="#fff"/>
      <stop offset="70%" stop-color="#e5e5e5"/>
      <stop offset="100%" stop-color="#b0b0b0"/>
    </radialGradient>
  </defs>

  <!-- Círculo base -->
  <circle cx="64" cy="64" r="60" fill="url(#shine)"/>

  <!-- Pentágono central -->
  <polygon points="64,38 82,50 76,70 52,70 46,50" fill="#111"/>

  <!-- Líneas de costura desde cada vértice del pentágono hacia el borde -->
  <line x1="64" y1="38" x2="64" y2="6" stroke="#111" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="82" y1="50" x2="115" y2="38" stroke="#111" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="76" y1="70" x2="105" y2="95" stroke="#111" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="52" y1="70" x2="23" y2="95" stroke="#111" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="46" y1="50" x2="13" y2="38" stroke="#111" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Pentágonos secundarios (borde) -->
  <polygon points="64,4 68,10 66,16 62,16 60,10" fill="#111"/>
  <polygon points="118,35 120,42 116,46 111,43 112,36" fill="#111"/>
  <polygon points="108,98 102,101 98,97 101,91 107,92" fill="#111"/>
  <polygon points="20,98 26,101 30,97 27,91 21,92" fill="#111"/>
  <polygon points="10,35 8,42 12,46 17,43 16,36" fill="#111"/>

  <!-- Borde -->
  <circle cx="64" cy="64" r="60" fill="none" stroke="#111" stroke-width="2" opacity="0.15"/>
</svg>
