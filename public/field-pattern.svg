<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <!-- Campo de fútbol — líneas decorativas para fondo -->
  <defs>
    <linearGradient id="field-gradient" x1="0" y1="0" x2="400" y2="400">
      <stop offset="0%" stop-color="#0a5c2a" stop-opacity="0.2"/>
      <stop offset="50%" stop-color="#16a34a" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#0a5c2a" stop-opacity="0.2"/>
    </linearGradient>
  </defs>

  <!-- Fondo -->
  <rect width="400" height="400" fill="url(#field-gradient)"/>

  <!-- Círculo central -->
  <circle cx="200" cy="200" r="80" fill="none" stroke="#16a34a" stroke-opacity="0.2" stroke-width="1.5"/>

  <!-- Línea central horizontal -->
  <line x1="0" y1="200" x2="400" y2="200" stroke="#16a34a" stroke-opacity="0.15" stroke-width="1"/>

  <!-- Punto central -->
  <circle cx="200" cy="200" r="3" fill="#22c55e" fill-opacity="0.3"/>

  <!-- Arco penal izquierdo -->
  <path d="M 140 167 A 52 52 0 0 1 140 233" fill="none" stroke="#16a34a" stroke-opacity="0.2" stroke-width="1.2"/>

  <!-- Arco penal derecho -->
  <path d="M 260 167 A 52 52 0 0 0 260 233" fill="none" stroke="#16a34a" stroke-opacity="0.2" stroke-width="1.2"/>

  <!-- Líneas de banda -->
  <rect x="20" y="20" width="360" height="360" fill="none" stroke="#0a5c2a" stroke-opacity="0.15" stroke-width="0.8" rx="2"/>

  <!-- Área chica izquierda -->
  <rect x="20" y="140" width="50" height="120" fill="none" stroke="#16a34a" stroke-opacity="0.18" stroke-width="1"/>

  <!-- Área chica derecha -->
  <rect x="330" y="140" width="50" height="120" fill="none" stroke="#16a34a" stroke-opacity="0.18" stroke-width="1"/>
</svg>
