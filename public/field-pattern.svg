<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <!-- Campo de fútbol — líneas sutiles, abstracto, elegante -->
  <defs>
    <linearGradient id="field-gradient" x1="0" y1="0" x2="400" y2="400">
      <stop offset="0%" stop-color="#0a5c2a" stop-opacity="0.06"/>
      <stop offset="50%" stop-color="#16a34a" stop-opacity="0.03"/>
      <stop offset="100%" stop-color="#0a5c2a" stop-opacity="0.06"/>
    </linearGradient>
  </defs>

  <!-- Fondo -->
  <rect width="400" height="400" fill="url(#field-gradient)"/>

  <!-- Círculo central — evoca el saque inicial -->
  <circle cx="200" cy="200" r="80" fill="none" stroke="#16a34a" stroke-opacity="0.04" stroke-width="1.5"/>

  <!-- Línea central horizontal -->
  <line x1="0" y1="200" x2="400" y2="200" stroke="#16a34a" stroke-opacity="0.03" stroke-width="1"/>

  <!-- Punto central -->
  <circle cx="200" cy="200" r="3" fill="#22c55e" fill-opacity="0.08"/>

  <!-- Arco de penalti (izquierda) — curva elegante -->
  <path d="M 60 200 Q 60 140 110 110" fill="none" stroke="#16a34a" stroke-opacity="0.04" stroke-width="1.2"/>

  <!-- Arco de penalti (derecha) — espejo -->
  <path d="M 340 200 Q 340 140 290 110" fill="none" stroke="#16a34a" stroke-opacity="0.04" stroke-width="1.2"/>

  <!-- Líneas de banda (bordes del campo) -->
  <rect x="20" y="20" width="360" height="360" fill="none" stroke="#0a5c2a" stroke-opacity="0.02" stroke-width="0.8" rx="2"/>

  <!-- Área chica (izquierda) -->
  <rect x="20" y="140" width="50" height="120" fill="none" stroke="#16a34a" stroke-opacity="0.03" stroke-width="1"/>

  <!-- Área chica (derecha) -->
  <rect x="330" y="140" width="50" height="120" fill="none" stroke="#16a34a" stroke-opacity="0.03" stroke-width="1"/>
</svg>
