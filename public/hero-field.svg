<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" fill="none">
  <defs>
    <linearGradient id="fg" x1="0" y1="0" x2="800" y2="400">
      <stop offset="0%" stop-color="#0a5c2a" stop-opacity="0.4"/>
      <stop offset="40%" stop-color="#16a34a" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#0a5c2a" stop-opacity="0.4"/>
    </linearGradient>
    <radialGradient id="glow" cx="400" cy="200" r="300">
      <stop offset="0%" stop-color="#16a34a" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
    <clipPath id="field-clip">
      <rect x="0" y="0" width="800" height="400" rx="20"/>
    </clipPath>
  </defs>

  <!-- Campo completo -->
  <g clip-path="url(#field-clip)">
    <!-- Fondo del campo -->
    <rect width="800" height="400" fill="url(#fg)"/>
    <rect width="800" height="400" fill="url(#glow)"/>

    <!-- Líneas de banda -->
    <rect x="40" y="20" width="720" height="360" stroke="#16a34a" stroke-opacity="0.45" stroke-width="1.5" rx="2"/>

    <!-- Línea central -->
    <line x1="400" y1="20" x2="400" y2="380" stroke="#16a34a" stroke-opacity="0.35" stroke-width="1"/>

    <!-- Círculo central -->
    <circle cx="400" cy="200" r="75" stroke="#16a34a" stroke-opacity="0.4" stroke-width="1.2"/>

    <!-- Punto central -->
    <circle cx="400" cy="200" r="4" fill="#22c55e" fill-opacity="0.45"/>

    <!-- Área grande izquierda -->
    <rect x="40" y="100" width="140" height="200" stroke="#16a34a" stroke-opacity="0.4" stroke-width="1.2"/>

    <!-- Área chica izquierda -->
    <rect x="40" y="145" width="55" height="110" stroke="#16a34a" stroke-opacity="0.45" stroke-width="1.2"/>

    <!-- Punto penal izquierdo -->
    <circle cx="130" cy="200" r="3" fill="#22c55e" fill-opacity="0.4"/>

    <!-- Arco penal izquierdo: centrado en (130,200), radio 75, curva hacia la derecha -->
    <path d="M 180 144 A 75 75 0 0 1 180 256" stroke="#16a34a" stroke-opacity="0.4" stroke-width="1.2" fill="none"/>

    <!-- Área grande derecha -->
    <rect x="620" y="100" width="140" height="200" stroke="#16a34a" stroke-opacity="0.4" stroke-width="1.2"/>

    <!-- Área chica derecha -->
    <rect x="705" y="145" width="55" height="110" stroke="#16a34a" stroke-opacity="0.45" stroke-width="1.2"/>

    <!-- Punto penal derecho -->
    <circle cx="670" cy="200" r="3" fill="#22c55e" fill-opacity="0.4"/>

    <!-- Arco penal derecho: centrado en (670,200), radio 75, curva hacia la izquierda -->
    <path d="M 620 144 A 75 75 0 0 0 620 256" stroke="#16a34a" stroke-opacity="0.4" stroke-width="1.2" fill="none"/>

    <!-- Esquinas -->
    <path d="M 40 20 Q 40 45 65 45" stroke="#22c55e" stroke-opacity="0.35" stroke-width="1" fill="none"/>
    <path d="M 760 20 Q 760 45 735 45" stroke="#22c55e" stroke-opacity="0.35" stroke-width="1" fill="none"/>
    <path d="M 40 380 Q 40 355 65 355" stroke="#22c55e" stroke-opacity="0.35" stroke-width="1" fill="none"/>
    <path d="M 760 380 Q 760 355 735 355" stroke="#22c55e" stroke-opacity="0.35" stroke-width="1" fill="none"/>
  </g>
</svg>
