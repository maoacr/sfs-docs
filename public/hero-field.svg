<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" fill="none">
  <defs>
    <linearGradient id="fg" x1="0" y1="0" x2="800" y2="400">
      <stop offset="0%" stop-color="#0a5c2a" stop-opacity="0.15"/>
      <stop offset="40%" stop-color="#16a34a" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#0a5c2a" stop-opacity="0.15"/>
    </linearGradient>
    <radialGradient id="glow" cx="400" cy="200" r="300">
      <stop offset="0%" stop-color="#16a34a" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
    <clipPath id="field-clip">
      <rect x="0" y="0" width="800" height="400" rx="20"/>
    </clipPath>
  </defs>

  <g clip-path="url(#field-clip)">
    <rect width="800" height="400" fill="url(#fg)"/>
    <rect width="800" height="400" fill="url(#glow)"/>

    <!-- Líneas de banda -->
    <rect x="40" y="20" width="720" height="360" stroke="#16a34a" stroke-opacity="0.30" stroke-width="1.5" stroke-linejoin="round"/>

    <!-- Línea central -->
    <line x1="400" y1="20" x2="400" y2="380" stroke="#16a34a" stroke-opacity="0.30" stroke-width="1"/>

    <!-- Círculo central -->
    <circle cx="400" cy="200" r="75" stroke="#16a34a" stroke-opacity="0.30" stroke-width="1.2"/>

    <!-- Punto central -->
    <circle cx="400" cy="200" r="4" fill="#22c55e" fill-opacity="0.30"/>

    <!-- Área grande izquierda -->
    <rect x="40" y="100" width="140" height="200" stroke="#16a34a" stroke-opacity="0.30" stroke-width="1.2" stroke-linejoin="round"/>

    <!-- Área chica izquierda -->
    <rect x="40" y="145" width="55" height="110" stroke="#16a34a" stroke-opacity="0.30" stroke-width="1.2" stroke-linejoin="round"/>

    <!-- Punto penal izquierdo -->
    <circle cx="130" cy="200" r="3" fill="#22c55e" fill-opacity="0.30"/>

    <!-- Arco penal izquierdo -->
    <path d="M 180 144 A 75 75 0 0 1 180 256" stroke="#16a34a" stroke-opacity="0.30" stroke-width="1.2" fill="none"/>

    <!-- Área grande derecha -->
    <rect x="620" y="100" width="140" height="200" stroke="#16a34a" stroke-opacity="0.30" stroke-width="1.2" stroke-linejoin="round"/>

    <!-- Área chica derecha -->
    <rect x="705" y="145" width="55" height="110" stroke="#16a34a" stroke-opacity="0.30" stroke-width="1.2" stroke-linejoin="round"/>

    <!-- Punto penal derecho -->
    <circle cx="670" cy="200" r="3" fill="#22c55e" fill-opacity="0.30"/>

    <!-- Arco penal derecho -->
    <path d="M 620 144 A 75 75 0 0 0 620 256" stroke="#16a34a" stroke-opacity="0.30" stroke-width="1.2" fill="none"/>

    <!-- Esquinas: arcos de cuarto de círculo con centro en cada banderín -->
    <path d="M 40 45 A 25 25 0 0 0 65 20" stroke="#22c55e" stroke-opacity="0.30" stroke-width="1" fill="none"/>
    <path d="M 760 45 A 25 25 0 0 1 735 20" stroke="#22c55e" stroke-opacity="0.30" stroke-width="1" fill="none"/>
    <path d="M 65 380 A 25 25 0 0 0 40 355" stroke="#22c55e" stroke-opacity="0.30" stroke-width="1" fill="none"/>
    <path d="M 735 380 A 25 25 0 0 1 760 355" stroke="#22c55e" stroke-opacity="0.30" stroke-width="1" fill="none"/>
  </g>
</svg>
